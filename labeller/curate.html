<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Icon review</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="app-icon-192.png">
<style>
:root {
  --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --tile: #ffffff;
  --accent: #0a66d8; --accent-fg: #ffffff; --chip: #f2f2f7;
  --reject: #d70015; --reject-bg: #ffe5e7; --somewhat: #b25000; --somewhat-bg: #ffefd2;
  --useful: #1a7f37; --useful-bg: #dff5e4; --on-level: #ffffff;
  --icon-filter: none; --icon-blend: multiply;
  --cell: 48px; --gap: 6px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111113; --fg: #f2f2f7; --muted: #98989f; --line: #2c2c2e; --tile: #1c1c1e;
    --accent: #4c9dff; --accent-fg: #0b0b0c; --chip: #242426;
    --reject: #ff453a; --reject-bg: #4a1513; --somewhat: #ffb340; --somewhat-bg: #40300c;
    --useful: #30d158; --useful-bg: #10361b; --on-level: #0b0b0c;
    --icon-filter: invert(1); --icon-blend: screen;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer;
  touch-action: manipulation; }

header { display: flex; align-items: center; gap: 10px; padding: 8px 16px 0;
  font-size: 14px; color: var(--muted); flex: none; }
header a { color: var(--accent); text-decoration: none; white-space: nowrap; }
#count { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--fg); font-weight: 600; }
#state { white-space: nowrap; }
#state.bad { color: var(--reject); }
header button, #show { padding: 5px 10px; border-radius: 9px; background: var(--chip); color: var(--fg);
  font: inherit; font-size: 14px; font-weight: 600; white-space: nowrap; border: 0; }

/* The brush: the level a tap gives an icon. */
#tools { display: flex; align-items: center; gap: 10px; padding: 8px 16px;
  border-bottom: 1px solid var(--line); flex: none; }
#brush { flex: 1; display: flex; gap: 6px; min-width: 0; }
#brush button { flex: 1; min-width: 0; padding: 7px 6px; border-radius: 10px; background: var(--chip);
  font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border: 2px solid transparent; }
#brush button b { font-weight: 500; opacity: .75; margin-left: 4px; }
#brush [data-l="reject"] { color: var(--reject); }
#brush [data-l="somewhat"] { color: var(--somewhat); }
#brush [data-l="useful"] { color: var(--useful); }
#brush [data-l="reject"].on { background: var(--reject); color: var(--on-level); }
#brush [data-l="somewhat"].on { background: var(--somewhat); color: var(--on-level); }
#brush [data-l="useful"].on { background: var(--useful); color: var(--on-level); }
@media (max-width: 480px) { .wide { display: none; } }

#all { flex: 1; overflow-y: auto; position: relative; padding: 0 16px calc(24px + env(safe-area-inset-bottom)); }
.g h2 { display: flex; align-items: center; gap: 10px; margin: 0; padding: 14px 0 8px;
  font-size: 13px; font-weight: 600; color: var(--muted); }
.g h2 span { flex: 1; }
.g h2 button { padding: 4px 10px; border-radius: 9px; background: var(--chip); color: var(--fg); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell), 1fr)); gap: var(--gap); }
.t { position: relative; aspect-ratio: 1; background: var(--tile); border: 1px solid var(--line);
  border-radius: 12px; }
/* The glyph is one cell of a sprite sheet; --x / --y select it. */
.t::before { content: ""; position: absolute; inset: 12%; background-repeat: no-repeat;
  background-size: calc(var(--cols) * 100%) calc(var(--rows) * 100%);
  background-position: var(--x) var(--y); }
.live .t::before { filter: var(--icon-filter); mix-blend-mode: var(--icon-blend); }
/* Each level has a colour and a mark of its own: a strike, a tilde, a tick. */
.t.reject { border: 2px solid var(--reject); background: var(--reject-bg); }
.t.reject::before { opacity: .4; }
.t.reject::after { content: ""; position: absolute; inset: 0; border-radius: 10px;
  background: linear-gradient(to top right, transparent calc(50% - 1.5px), var(--reject) calc(50% - 1.5px),
    var(--reject) calc(50% + 1.5px), transparent calc(50% + 1.5px)); }
.t.somewhat { border: 2px solid var(--somewhat); background: var(--somewhat-bg); }
.t.useful { border: 2px solid var(--useful); background: var(--useful-bg); }
.t.somewhat::after, .t.useful::after { position: absolute; top: 1px; right: 1px; width: 15px; height: 15px;
  border-radius: 8px; color: var(--on-level); font-size: 11px; font-weight: 800; line-height: 15px;
  text-align: center; }
.t.somewhat::after { content: "~"; background: var(--somewhat); }
.t.useful::after { content: "✓"; background: var(--useful); }
.hide { display: none; }
#empty { color: var(--muted); text-align: center; padding: 40px 0; display: none; }
#all.none #empty { display: block; }

#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
  transform: translateX(-50%); display: flex; align-items: center; gap: 14px; background: var(--fg);
  color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 14px; opacity: 0;
  transition: opacity .2s; pointer-events: none; white-space: nowrap; }
#toast.show { opacity: .95; pointer-events: auto; }
#toast button { font-weight: 700; text-decoration: underline; display: none; }
#toast.undo button { display: inline; }
</style>
<style id="sheets"></style>
</head>
<body>
<header>
  <a href="./">‹ Tasks</a>
  <span id="count"></span>
  <span id="state"></span>
  <select id="show" aria-label="Show">
    <option value="">Show all</option>
    <option value="unlabelled">Unlabelled</option>
    <option value="reject">Reject</option>
    <option value="somewhat">Somewhat</option>
    <option value="useful">Useful</option>
  </select>
  <button id="size" title="Tile size" aria-label="Tile size">S</button>
</header>
<div id="tools">
  <div id="brush" role="radiogroup" aria-label="Level a tap gives an icon">
    <button data-l="reject" role="radio">✕ Reject<b></b></button>
    <button data-l="somewhat" role="radio">~ Somewhat<b></b></button>
    <button data-l="useful" role="radio">✓ Useful<b></b></button>
  </div>
</div>
<main id="all"><div id="empty">No icons here.</div></main>
<div id="toast"><span></span><button>Undo</button></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const fmt = (n) => n.toLocaleString("en-US");
const CLIENT = (navigator.userAgent.match(/iPad|iPhone|Android|Macintosh|Windows|Linux/) || [""])[0];
const SIZES = { S: 48, M: 64, L: 84 };
const LEVELS = ["reject", "somewhat", "useful"];
const NAMES = { reject: "Reject", somewhat: "Somewhat", useful: "Useful" };

let lay = null;          // {build, cols, rows, per_sheet, icons, groups}
let labels = new Map();  // icon name -> level; absent = not labelled yet
let brush = "reject";    // the level a tap gives
let show = "";           // filter: "", "unlabelled" or a level
let tiles = [];          // tile element per icon, in display order
let sections = [];       // section element per group
let pending = [];        // events not yet confirmed by the server
let sending = false;
let failed = false;

function toast(msg, undo) {
  const t = $("toast");
  t.firstElementChild.textContent = msg;
  t.classList.toggle("undo", !!undo);
  t.lastElementChild.onclick = () => { t.classList.remove("show"); undo(); };
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), undo ? 7000 : 1600);
}
async function api(path, body) {
  const opt = body ? { method: "POST", headers: { "Content-Type": "application/json" },
                       body: JSON.stringify(body) } : {};
  const r = await fetch(path, opt);
  if (!r.ok) { const e = new Error((await r.text()) || r.status); e.status = r.status; throw e; }
  return r.json();
}

// --- saving ---------------------------------------------------------------
// Every change is queued and mirrored in localStorage until the server confirms it,
// so a dropped connection or a closed tab loses nothing.
function queue(events) {
  pending.push(...events);
  store.set("curate-pending", JSON.stringify(pending));
  renderState();
  clearTimeout(queue.timer); queue.timer = setTimeout(flush, 300);
}
async function flush() {
  if (sending || !pending.length) return;
  sending = true;
  const batch = pending.slice();
  try {
    await api("api/curation", { events: batch, client: CLIENT });
    pending = pending.slice(batch.length); failed = false;
  } catch (e) {
    failed = true;
    if (e.status === 400) {   // rejected, not a connection problem: retrying cannot help
      pending = pending.slice(batch.length); toast("Not saved: " + e.message);
    }
  }
  store.set("curate-pending", JSON.stringify(pending));
  sending = false;
  renderState();
  if (pending.length) { clearTimeout(queue.timer); queue.timer = setTimeout(flush, failed ? 5000 : 0); }
}
function renderState() {
  const st = $("state");
  st.textContent = pending.length ? (failed ? `${fmt(pending.length)} unsaved` : "saving…") : "✓ saved";
  st.className = pending.length && failed ? "bad" : "";
}

// --- rendering ------------------------------------------------------------
const levelOf = (i) => labels.get(lay.icons[i]) || null;
function renderCount() {
  const n = { reject: 0, somewhat: 0, useful: 0 };
  for (const lab of labels.values()) n[lab]++;
  for (const b of $("brush").children) b.lastElementChild.textContent = fmt(n[b.dataset.l]);
  const left = lay.icons.length - labels.size;
  $("count").innerHTML = `${fmt(left)} left<span class="wide"> of ${fmt(lay.icons.length)}</span>`;
}
function renderGroup(g) {
  const [start, size] = lay.groups[g];
  let left = 0;
  for (let i = start; i < start + size; i++) if (!levelOf(i)) left++;
  const sec = sections[g];
  sec.querySelector("span").textContent =
    `Group ${g + 1} · ${fmt(size)} icons` + (left ? ` · ${fmt(left)} left` : " · done");
  // One tap finishes a group: whatever is still unlabelled gets the brush's level.
  sec.querySelector("button").textContent = left ? `Rest → ${NAMES[brush]}` : "Clear group";
}
function setLevel(i, level) {
  const name = lay.icons[i];
  if (level) labels.set(name, level); else labels.delete(name);
  tiles[i].classList.remove(...LEVELS);
  if (level) tiles[i].classList.add(level);
}
function setBrush(level) {
  brush = LEVELS.includes(level) ? level : "reject";
  store.set("curate-brush", brush);
  for (const b of $("brush").children) {
    b.classList.toggle("on", b.dataset.l === brush);
    b.setAttribute("aria-checked", b.dataset.l === brush);
  }
  if (lay) lay.groups.forEach((_, g) => renderGroup(g));
}
function build() {
  const pct = (k, n) => (n > 1 ? (k / (n - 1)) * 100 : 0) + "%";
  const nSheets = Math.ceil(lay.icons.length / lay.per_sheet);
  let css = "";
  for (let s = 0; s < nSheets; s++) css += `.live .s${s}::before{background-image:url(sprites/${lay.build}-${s}.png)}`;
  $("sheets").textContent = css;
  const all = $("all");
  all.style.setProperty("--cols", lay.cols); all.style.setProperty("--rows", lay.rows);
  const frag = document.createDocumentFragment();
  lay.groups.forEach(([start, size], g) => {
    const sec = document.createElement("section");
    sec.className = "g"; sec.dataset.g = g;
    sec.innerHTML = `<h2><span></span><button></button></h2><div class="grid"></div>`;
    const grid = sec.lastElementChild;
    for (let i = start; i < start + size; i++) {
      const k = i % lay.per_sheet;
      const b = document.createElement("button");
      b.className = "t s" + Math.floor(i / lay.per_sheet); b.dataset.i = i;
      b.style.setProperty("--x", pct(k % lay.cols, lay.cols));
      b.style.setProperty("--y", pct(Math.floor(k / lay.cols), lay.rows));
      if (levelOf(i)) b.classList.add(levelOf(i));
      tiles.push(b); grid.appendChild(b);
    }
    sections.push(sec); frag.appendChild(sec);
  });
  all.appendChild(frag);
  lay.groups.forEach((_, g) => renderGroup(g));
  renderCount();
  // Only the groups near the viewport hold their sprite sheets, to bound memory.
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) e.target.classList.toggle("live", e.isIntersecting);
  }, { root: all, rootMargin: "1500px 0px" });
  sections.forEach((s) => io.observe(s));
  warm(0, nSheets);
}
// Fetch every sheet once in the background, so scrolling never waits for the network.
function warm(s, n) {
  if (s >= n) return;
  const img = new Image();
  img.onload = img.onerror = () => warm(s + 1, n);
  img.src = `sprites/${lay.build}-${s}.png`;
}

// --- state changes --------------------------------------------------------
// A tap gives the icon the brush's level; a tap on an icon that already has it clears it.
function toggle(i) {
  const level = levelOf(i) === brush ? null : brush;
  setLevel(i, level);
  renderGroup(groupOf(i)); renderCount();
  queue([{ icon: lay.icons[i], label: level }]);
}
function groupOf(i) { return +tiles[i].closest(".g").dataset.g; }
function toggleGroup(g) {
  const [start, size] = lay.groups[g];
  const idx = Array.from({ length: size }, (_, k) => start + k);
  const before = idx.map(levelOf);
  const fill = before.includes(null);   // otherwise the group is done, and the button clears it
  const level = brush;
  const apply = (want) => {
    const events = [];
    idx.forEach((i, k) => {
      if (levelOf(i) !== want[k]) {
        setLevel(i, want[k]); events.push({ icon: lay.icons[i], label: want[k], bulk: true });
      }
    });
    renderGroup(g); renderCount();
    if (events.length) queue(events);
    return events.length;
  };
  const n = apply(before.map((b) => (fill ? b || level : null)));
  toast(fill ? `${fmt(n)} icons in group ${g + 1} → ${NAMES[level]}` : `Cleared group ${g + 1} (${fmt(n)} icons)`,
        () => apply(before));
}

// --- view: size, filter, resume -------------------------------------------
function setSize(key) {
  if (!SIZES[key]) key = window.innerWidth >= 700 ? "M" : "S";
  document.documentElement.style.setProperty("--cell", SIZES[key] + "px");
  document.documentElement.style.setProperty("--gap", (key === "S" ? 6 : 8) + "px");
  $("size").textContent = key; store.set("curate-size", key);
}
// The filter is a snapshot taken when it is chosen: an icon labelled while a filter is
// on stays where it is, so the grid never shifts under the finger.
function setShow(value) {
  const all = $("all");
  if (!show && value) setShow.place = topGroup();   // where to return to, in the full grid
  show = value;
  let any = false;
  sections.forEach((sec, g) => {
    const [start, size] = lay.groups[g];
    let visible = 0;
    for (let i = start; i < start + size; i++) {
      const keep = !show || (levelOf(i) || "unlabelled") === show;
      tiles[i].classList.toggle("hide", !keep);
      if (keep) visible++;
    }
    sec.classList.toggle("hide", !visible);
    any = any || visible > 0;
  });
  all.classList.toggle("none", !any);
  if (show) all.scrollTop = 0;
  else if (setShow.place) { const [g, off] = setShow.place; all.scrollTop = sections[g].offsetTop + off; }
}
function topGroup() {
  const all = $("all");
  for (const s of sections) {
    if (s.offsetTop + s.offsetHeight > all.scrollTop) return [+s.dataset.g, all.scrollTop - s.offsetTop];
  }
  return [0, 0];
}
function keepPlace(change) {   // keep the same group on screen across a layout change
  const [g, off] = topGroup();
  const frac = off / Math.max(1, sections[g].offsetHeight);
  change();
  $("all").scrollTop = sections[g].offsetTop + frac * sections[g].offsetHeight;
}
let placeTimer = null;
function rememberPlace() {
  clearTimeout(placeTimer);
  placeTimer = setTimeout(() => { if (!show) store.set("curate-place", JSON.stringify(topGroup())); }, 400);
}

// --- wiring ---------------------------------------------------------------
$("all").addEventListener("click", (e) => {
  const t = e.target.closest(".t"); if (t) return toggle(+t.dataset.i);
  const b = e.target.closest("h2 button"); if (b) toggleGroup(+b.closest(".g").dataset.g);
});
$("all").addEventListener("scroll", rememberPlace, { passive: true });
$("brush").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (b) setBrush(b.dataset.l);
});
$("show").onchange = () => setShow($("show").value);
$("size").onclick = () => {
  const keys = Object.keys(SIZES);
  keepPlace(() => setSize(keys[(keys.indexOf($("size").textContent) + 1) % keys.length]));
};
document.addEventListener("keydown", (e) => {   // desktop: 1 / 2 / 3 pick the brush
  if (e.target === $("show") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (LEVELS[+e.key - 1]) setBrush(LEVELS[+e.key - 1]);
});
window.addEventListener("online", flush);
document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); });

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});  // needs HTTPS; optional
}

(async function init() {
  setSize(store.get("curate-size"));
  setBrush(store.get("curate-brush"));
  lay = await api("api/curation");
  labels = new Map(Object.entries(lay.labels));
  // Changes a previous session could not send are replayed on top of the server's state.
  // (Before the three levels existed, an event only said `removed`.)
  const known = new Set(lay.icons);
  try {
    pending = JSON.parse(store.get("curate-pending") || "[]").filter((e) => known.has(e.icon))
      .map((e) => ("label" in e ? e : { icon: e.icon, label: e.removed ? "reject" : null, bulk: e.bulk }));
  } catch (e) { pending = []; }
  for (const e of pending) { if (e.label) labels.set(e.icon, e.label); else labels.delete(e.icon); }
  build();
  renderState(); flush();
  try {
    const [g, off] = JSON.parse(store.get("curate-place") || "[0,0]");
    if (sections[g]) $("all").scrollTop = sections[g].offsetTop + off;
  } catch (e) {}
})().catch((e) => {
  const p = document.createElement("p");
  p.style.padding = "16px"; p.textContent = "Cannot load the icon review: " + (e.message || e);
  document.body.replaceChildren(p);
});
</script>
</body>
</html>
