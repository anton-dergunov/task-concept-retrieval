<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Icon review</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="app-icon-192.png">
<style>
:root {
  --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --tile: #ffffff;
  --accent: #0a66d8; --accent-fg: #ffffff; --chip: #f2f2f7;
  --bad: #d70015; --bad-bg: #ffe5e7; --icon-filter: none; --icon-blend: multiply;
  --cell: 48px; --gap: 6px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111113; --fg: #f2f2f7; --muted: #98989f; --line: #2c2c2e; --tile: #1c1c1e;
    --accent: #4c9dff; --accent-fg: #0b0b0c; --chip: #242426;
    --bad: #ff453a; --bad-bg: #4a1513; --icon-filter: invert(1); --icon-blend: screen;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer;
  touch-action: manipulation; }

header { display: flex; align-items: center; gap: 10px; padding: 8px 16px;
  border-bottom: 1px solid var(--line); font-size: 14px; color: var(--muted); flex: none; }
header a { color: var(--accent); text-decoration: none; white-space: nowrap; }
#count { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--fg); font-weight: 600; }
#state { white-space: nowrap; }
#state.bad { color: var(--bad); }
header button { padding: 5px 10px; border-radius: 9px; background: var(--chip); color: var(--fg);
  font-weight: 600; white-space: nowrap; }
#only.on { background: var(--fg); color: var(--bg); }
@media (max-width: 480px) { .wide { display: none; } }

#all { flex: 1; overflow-y: auto; position: relative; padding: 0 16px calc(24px + env(safe-area-inset-bottom)); }
.g h2 { display: flex; align-items: center; gap: 10px; margin: 0; padding: 14px 0 8px;
  font-size: 13px; font-weight: 600; color: var(--muted); }
.g h2 span { flex: 1; }
.g h2 button { padding: 4px 10px; border-radius: 9px; background: var(--chip); color: var(--fg); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell), 1fr)); gap: var(--gap); }
.t { position: relative; aspect-ratio: 1; background: var(--tile); border: 1px solid var(--line);
  border-radius: 12px; }
/* The glyph is one cell of a sprite sheet; --x / --y select it. */
.t::before { content: ""; position: absolute; inset: 12%; background-repeat: no-repeat;
  background-size: calc(var(--cols) * 100%) calc(var(--rows) * 100%);
  background-position: var(--x) var(--y); }
.live .t::before { filter: var(--icon-filter); mix-blend-mode: var(--icon-blend); }
.t.rm { border: 2px solid var(--bad); background: var(--bad-bg); }
.t.rm::before { opacity: .4; }
.t.rm::after { content: ""; position: absolute; inset: 0; border-radius: 10px;
  background: linear-gradient(to top right, transparent calc(50% - 1.5px), var(--bad) calc(50% - 1.5px),
    var(--bad) calc(50% + 1.5px), transparent calc(50% + 1.5px)); }
#all.only .t:not(.rm), #all.only .g.clean { display: none; }
#empty { color: var(--muted); text-align: center; padding: 40px 0; display: none; }
#all.only.clean #empty { display: block; }

#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
  transform: translateX(-50%); display: flex; align-items: center; gap: 14px; background: var(--fg);
  color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 14px; opacity: 0;
  transition: opacity .2s; pointer-events: none; white-space: nowrap; }
#toast.show { opacity: .95; pointer-events: auto; }
#toast button { font-weight: 700; text-decoration: underline; display: none; }
#toast.undo button { display: inline; }
</style>
<style id="sheets"></style>
</head>
<body>
<header>
  <a href="./">‹ Tasks</a>
  <span id="count"></span>
  <span id="state"></span>
  <button id="only" title="Show only the icons marked for removal">Marked only</button>
  <button id="size" title="Tile size" aria-label="Tile size">S</button>
</header>
<main id="all"><div id="empty">Nothing is marked for removal.</div></main>
<div id="toast"><span></span><button>Undo</button></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const fmt = (n) => n.toLocaleString("en-US");
const CLIENT = (navigator.userAgent.match(/iPad|iPhone|Android|Macintosh|Windows|Linux/) || [""])[0];
const SIZES = { S: 48, M: 64, L: 84 };

let lay = null;          // {build, cols, rows, per_sheet, icons, groups}
let removed = new Set(); // icon names marked for removal
let tiles = [];          // tile element per icon, in display order
let sections = [];       // section element per group
let pending = [];        // events not yet confirmed by the server
let sending = false;
let failed = false;

function toast(msg, undo) {
  const t = $("toast");
  t.firstElementChild.textContent = msg;
  t.classList.toggle("undo", !!undo);
  t.lastElementChild.onclick = () => { t.classList.remove("show"); undo(); };
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), undo ? 7000 : 1600);
}
async function api(path, body) {
  const opt = body ? { method: "POST", headers: { "Content-Type": "application/json" },
                       body: JSON.stringify(body) } : {};
  const r = await fetch(path, opt);
  if (!r.ok) { const e = new Error((await r.text()) || r.status); e.status = r.status; throw e; }
  return r.json();
}

// --- saving ---------------------------------------------------------------
// Every change is queued and mirrored in localStorage until the server confirms it,
// so a dropped connection or a closed tab loses nothing.
function queue(events) {
  pending.push(...events);
  store.set("curate-pending", JSON.stringify(pending));
  renderState();
  clearTimeout(queue.timer); queue.timer = setTimeout(flush, 300);
}
async function flush() {
  if (sending || !pending.length) return;
  sending = true;
  const batch = pending.slice();
  try {
    await api("api/curation", { events: batch, client: CLIENT });
    pending = pending.slice(batch.length); failed = false;
  } catch (e) {
    failed = true;
    if (e.status === 400) {   // rejected, not a connection problem: retrying cannot help
      pending = pending.slice(batch.length); toast("Not saved: " + e.message);
    }
  }
  store.set("curate-pending", JSON.stringify(pending));
  sending = false;
  renderState();
  if (pending.length) { clearTimeout(queue.timer); queue.timer = setTimeout(flush, failed ? 5000 : 0); }
}
function renderState() {
  const st = $("state");
  st.textContent = pending.length ? (failed ? `${fmt(pending.length)} unsaved` : "saving…") : "✓ saved";
  st.className = pending.length && failed ? "bad" : "";
}

// --- rendering ------------------------------------------------------------
function renderCount() {
  $("count").innerHTML = `${fmt(removed.size)} marked<span class="wide"> of ${fmt(lay.icons.length)}</span>`;
  $("all").classList.toggle("clean", removed.size === 0);
}
function renderGroup(g) {
  const [start, size] = lay.groups[g];
  let n = 0;
  for (let i = start; i < start + size; i++) if (removed.has(lay.icons[i])) n++;
  const sec = sections[g];
  sec.classList.toggle("clean", n === 0);
  sec.querySelector("span").textContent =
    `Group ${g + 1} · ${fmt(size)} icons` + (n ? ` · ${fmt(n)} marked` : "");
  sec.querySelector("button").textContent = n === size ? "Restore all" : "Remove all";
}
function setMark(i, on) {
  const name = lay.icons[i];
  if (on) removed.add(name); else removed.delete(name);
  tiles[i].classList.toggle("rm", on);
  tiles[i].setAttribute("aria-pressed", on);
}
function build() {
  const pct = (k, n) => (n > 1 ? (k / (n - 1)) * 100 : 0) + "%";
  const nSheets = Math.ceil(lay.icons.length / lay.per_sheet);
  let css = "";
  for (let s = 0; s < nSheets; s++) css += `.live .s${s}::before{background-image:url(sprites/${lay.build}-${s}.png)}`;
  $("sheets").textContent = css;
  const all = $("all");
  all.style.setProperty("--cols", lay.cols); all.style.setProperty("--rows", lay.rows);
  const frag = document.createDocumentFragment();
  lay.groups.forEach(([start, size], g) => {
    const sec = document.createElement("section");
    sec.className = "g"; sec.dataset.g = g;
    sec.innerHTML = `<h2><span></span><button></button></h2><div class="grid"></div>`;
    const grid = sec.lastElementChild;
    for (let i = start; i < start + size; i++) {
      const k = i % lay.per_sheet;
      const b = document.createElement("button");
      b.className = "t s" + Math.floor(i / lay.per_sheet); b.dataset.i = i;
      b.style.setProperty("--x", pct(k % lay.cols, lay.cols));
      b.style.setProperty("--y", pct(Math.floor(k / lay.cols), lay.rows));
      if (removed.has(lay.icons[i])) b.classList.add("rm");
      tiles.push(b); grid.appendChild(b);
    }
    sections.push(sec); frag.appendChild(sec);
  });
  all.appendChild(frag);
  lay.groups.forEach((_, g) => renderGroup(g));
  renderCount();
  // Only the groups near the viewport hold their sprite sheets, to bound memory.
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) e.target.classList.toggle("live", e.isIntersecting);
  }, { root: all, rootMargin: "1500px 0px" });
  sections.forEach((s) => io.observe(s));
  warm(0, nSheets);
}
// Fetch every sheet once in the background, so scrolling never waits for the network.
function warm(s, n) {
  if (s >= n) return;
  const img = new Image();
  img.onload = img.onerror = () => warm(s + 1, n);
  img.src = `sprites/${lay.build}-${s}.png`;
}

// --- state changes --------------------------------------------------------
function toggle(i) {
  const on = !removed.has(lay.icons[i]);
  setMark(i, on);
  renderGroup(groupOf(i)); renderCount();
  queue([{ icon: lay.icons[i], removed: on }]);
}
function groupOf(i) { return +tiles[i].closest(".g").dataset.g; }
function toggleGroup(g) {
  const [start, size] = lay.groups[g];
  const idx = Array.from({ length: size }, (_, k) => start + k);
  const before = idx.map((i) => removed.has(lay.icons[i]));
  const on = !before.every(Boolean);   // "Restore all" only when everything is marked
  const apply = (target) => {
    const events = [];
    idx.forEach((i, k) => {
      const want = target === null ? before[k] : target;
      if (removed.has(lay.icons[i]) !== want) {
        setMark(i, want); events.push({ icon: lay.icons[i], removed: want, bulk: true });
      }
    });
    renderGroup(g); renderCount();
    if (events.length) queue(events);
    return events.length;
  };
  const n = apply(on);
  toast(`${on ? "Marked" : "Restored"} ${fmt(n)} icons in group ${g + 1}`, () => apply(null));
}

// --- view: size, filter, resume -------------------------------------------
function setSize(key) {
  if (!SIZES[key]) key = window.innerWidth >= 700 ? "M" : "S";
  document.documentElement.style.setProperty("--cell", SIZES[key] + "px");
  document.documentElement.style.setProperty("--gap", (key === "S" ? 6 : 8) + "px");
  $("size").textContent = key; store.set("curate-size", key);
}
function topGroup() {
  const all = $("all");
  for (const s of sections) {
    if (s.offsetTop + s.offsetHeight > all.scrollTop) return [+s.dataset.g, all.scrollTop - s.offsetTop];
  }
  return [0, 0];
}
function keepPlace(change) {   // keep the same group on screen across a layout change
  const [g, off] = topGroup();
  const frac = off / Math.max(1, sections[g].offsetHeight);
  change();
  $("all").scrollTop = sections[g].offsetTop + frac * sections[g].offsetHeight;
}
let placeTimer = null;
function rememberPlace() {
  clearTimeout(placeTimer);
  placeTimer = setTimeout(() => {
    if (!$("all").classList.contains("only")) store.set("curate-place", JSON.stringify(topGroup()));
  }, 400);
}

// --- wiring ---------------------------------------------------------------
$("all").addEventListener("click", (e) => {
  const t = e.target.closest(".t"); if (t) return toggle(+t.dataset.i);
  const b = e.target.closest("h2 button"); if (b) toggleGroup(+b.closest(".g").dataset.g);
});
$("all").addEventListener("scroll", rememberPlace, { passive: true });
$("size").onclick = () => {
  const keys = Object.keys(SIZES);
  keepPlace(() => setSize(keys[(keys.indexOf($("size").textContent) + 1) % keys.length]));
};
$("only").onclick = () => {
  const on = !$("all").classList.contains("only");
  if (on) $("only").place = topGroup();   // where to return to, measured in the full grid
  $("all").classList.toggle("only", on);
  $("only").classList.toggle("on", on);
  if (on) { $("all").scrollTop = 0; }
  else { const [g, off] = $("only").place; $("all").scrollTop = sections[g].offsetTop + off; }
};
window.addEventListener("online", flush);
document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); });

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});  // needs HTTPS; optional
}

(async function init() {
  setSize(store.get("curate-size"));
  const s = await api("api/curation");
  lay = s; removed = new Set(s.removed);
  // Changes a previous session could not send are replayed on top of the server's state.
  const known = new Set(lay.icons);
  try { pending = JSON.parse(store.get("curate-pending") || "[]").filter((e) => known.has(e.icon)); }
  catch (e) { pending = []; }
  for (const e of pending) { if (e.removed) removed.add(e.icon); else removed.delete(e.icon); }
  build();
  renderState(); flush();
  try {
    const [g, off] = JSON.parse(store.get("curate-place") || "[0,0]");
    if (sections[g]) $("all").scrollTop = sections[g].offsetTop + off;
  } catch (e) {}
})().catch((e) => {
  const p = document.createElement("p");
  p.style.padding = "16px"; p.textContent = "Cannot load the icon review: " + (e.message || e);
  document.body.replaceChildren(p);
});
</script>
</body>
</html>
